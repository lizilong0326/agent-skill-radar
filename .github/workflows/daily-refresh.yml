name: Refresh catalog and publish site

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      reclassify_all:
        description: Recheck every document, including unchanged files
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agent-skill-radar-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update GitHub data and classify changed documents
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          RECLASSIFY_ALL: ${{ inputs.reclassify_all }}
        run: |
          if [ "$RECLASSIFY_ALL" = "true" ]; then
            python -m radar.collector --reclassify-all --max-ai-calls 100
          else
            python -m radar.collector --max-ai-calls 100
          fi
      - name: Refresh Agent and MCP candidate rankings
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: python -m radar.ranked_collector --agent-target 300 --mcp-target 200 --growth-per-run 10
      - name: Build one public catalog from both sources
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: python -m radar.unified_index --max-ai-calls 50
      - name: Check code and data invariants
        run: python -m unittest discover -s tests -v
      - name: Save refreshed index
        run: |
          git config user.name "agent-skill-radar[bot]"
          git config user.email "agent-skill-radar[bot]@users.noreply.github.com"
          git add data/catalog.json site/data/catalog.json data/rankings.json site/data/rankings.json data/index.json site/data/index.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh tool catalog"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
