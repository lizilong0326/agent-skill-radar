<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c2b">
  <meta name="description" content="每天更新的开源 Skill、Agent 与 MCP 工具目录。按真实文档分类，并公开标签依据。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23101c2b'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23efc06f' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='9' fill='none' stroke='%23efc06f' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23efc06f'/%3E%3Cpath d='M32 32L47 18' stroke='%23efc06f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>Agent Skill Radar · 开源工具雷达</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Agent Skill Radar 首页"><span class="brand-mark" aria-hidden="true"><span></span></span><span>Agent Skill <strong>Radar</strong></span></a>
      <div class="topbar-right"><span id="sync-status" class="sync-status">正在读取目录…</span><a class="github-link" href="https://github.com/lizilong0326/agent-skill-radar" target="_blank" rel="noopener noreferrer">查看 GitHub ↗</a></div>
    </header>

    <main class="main-layout">
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow"><span class="live-dot"></span> 每日更新的开源工具目录</div>
        <h1 id="page-title">找到真正适合任务的<br><em>Skill、Agent 与 MCP</em></h1>
        <p>从 GitHub 收集项目，阅读实际说明文件后标注用途。每个标签都能追溯到来源，而仓库热度与单个工具分开展示。</p>
        <div class="metrics" aria-label="目录概况">
          <div><strong id="metric-items">—</strong><span>在列工具</span></div>
          <div><strong id="metric-repos">—</strong><span>开源仓库</span></div>
          <div><strong id="metric-review">—</strong><span>待进一步核对</span></div>
        </div>
      </section>

      <section class="workspace" aria-label="搜索与筛选工具">
        <div class="toolbar">
          <div class="search-wrap"><label class="sr-only" for="search">搜索工具、用途或仓库</label><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索工具、用途、仓库…" autocomplete="off"></div>
          <label class="sort-wrap" for="sort">排序 <select id="sort"><option value="stars">仓库 Star</option><option value="growth">近 30 天增长</option><option value="updated">最近更新</option><option value="name">名称</option></select></label>
        </div>
        <div class="type-row" id="kind-tabs" role="group" aria-label="工具类型"></div>
        <div class="content-grid">
          <aside id="filters" class="filters" aria-label="用途标签">
            <div class="filter-heading"><h2>按用途筛选</h2><div class="filter-actions"><button id="toggle-tags" type="button" aria-expanded="false" aria-controls="tag-filters">展开标签</button><button id="clear-tags" type="button">清除</button></div></div>
            <div id="tag-filters" class="tag-filters"></div>
            <label class="archive-toggle"><input type="checkbox" id="include-inactive"><span>包含观察与归档条目</span></label>
            <div class="method-note"><span class="method-symbol" aria-hidden="true">◎</span><p>标签来自说明文件和使用示例。规则初筛的条目会明确标记，方便继续核对。</p></div>
          </aside>
          <div class="results">
            <div class="results-heading"><h2 id="results-title">全部工具</h2><span id="result-count" role="status" aria-live="polite">读取中…</span></div>
            <div id="cards" class="cards" aria-live="polite"></div>
            <button id="load-more" class="load-more" type="button" hidden>显示更多</button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer"><span>Agent Skill Radar · 数据每天自动同步</span><span>Star 属于 GitHub 仓库，不代表单个 Skill 的安装量。</span></footer>
  </div>

  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
</body>
</html>
